substitutions:
  _ENVIRONMENT: "dev"
  _STATE_PROJECT_ID: ""
  _TERRAFORM_VERSION: "1.9.8"

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: validate-environment
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    args:
      - -c
      - |
        case "${_ENVIRONMENT}" in
          dev|stage|prod) ;;
          *) echo "Invalid _ENVIRONMENT: ${_ENVIRONMENT}. Use dev, stage, or prod." && exit 1 ;;
        esac
        test -d "environments/${_ENVIRONMENT}" || { echo "Missing environments/${_ENVIRONMENT}."; exit 1; }

  - id: terraform-fmt
    name: hashicorp/terraform:${_TERRAFORM_VERSION}
    entrypoint: sh
    args:
      - -c
      - |
        terraform fmt -check -recursive environments

  - id: terraform-init
    name: hashicorp/terraform:${_TERRAFORM_VERSION}
    entrypoint: sh
    dir: environments/${_ENVIRONMENT}
    args:
      - -c
      - |
        STATE_PROJECT_ID="${_STATE_PROJECT_ID}"
        if [ -z "$STATE_PROJECT_ID" ]; then
          STATE_PROJECT_ID="${PROJECT_ID}"
        fi
        terraform init -input=false \
          -backend-config="bucket=${STATE_PROJECT_ID}-terraform-state-${_ENVIRONMENT}" \
          -backend-config="prefix=terraform/state/${_ENVIRONMENT}"

  - id: terraform-validate
    name: hashicorp/terraform:${_TERRAFORM_VERSION}
    entrypoint: sh
    dir: environments/${_ENVIRONMENT}
    args:
      - -c
      - |
        terraform validate

  - id: terraform-plan
    name: hashicorp/terraform:${_TERRAFORM_VERSION}
    entrypoint: sh
    dir: environments/${_ENVIRONMENT}
    args:
      - -c
      - |
        terraform plan -input=false -out=tfplan
        terraform show -no-color tfplan > terraform-plan-${_ENVIRONMENT}.txt

  - id: tflint
    name: ghcr.io/terraform-linters/tflint:v0.53.0
    entrypoint: sh
    dir: environments/${_ENVIRONMENT}
    args:
      - -c
      - |
        tflint --init
        tflint --format compact

  - id: tfsec
    name: aquasec/tfsec:v1.28
    args:
      - environments/${_ENVIRONMENT}

  - id: checkov
    name: bridgecrew/checkov:3.2.77
    args:
      - -d
      - environments/${_ENVIRONMENT}
      - --quiet

artifacts:
  objects:
    location: gs://${PROJECT_ID}-cloudbuild-artifacts/terraform-plans/${BUILD_ID}/
    paths:
      - environments/${_ENVIRONMENT}/tfplan
      - environments/${_ENVIRONMENT}/terraform-plan-${_ENVIRONMENT}.txt
