name: Build Rotator

on:
  push:
    branches: [main]
    paths:
      - 'gcp-terraform-modules/services/cloudsql-secret-rotator/**'
      - '.github/workflows/build-rotator.yml'

permissions:
  contents: read
  id-token: write

env:
  ROTATOR_CONTEXT: gcp-terraform-modules/services/cloudsql-secret-rotator
  IMAGE_TAR: rotator-image.tar

jobs:
  detect-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_exists: ${{ steps.detect.outputs.source_exists }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        name: Detect rotator source
        run: |
          if [ -d "$ROTATOR_CONTEXT" ]; then
            echo "source_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "source_exists=false" >> "$GITHUB_OUTPUT"
            echo "Skipping rotator build because $ROTATOR_CONTEXT is not present in this repository."
          fi

  security-scan:
    needs: detect-source
    if: needs.detect-source.outputs.source_exists == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade bandit
      - name: Run Bandit
        run: bandit -r "$ROTATOR_CONTEXT" -ll

  build:
    needs: security-scan
    if: needs.security-scan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: |
          docker build -f "$ROTATOR_CONTEXT/Dockerfile" -t rotator:${{ github.sha }} "$ROTATOR_CONTEXT"
          docker save rotator:${{ github.sha }} -o "$IMAGE_TAR"
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: rotator-image-${{ github.run_id }}
          path: ${{ env.IMAGE_TAR }}
          retention-days: 1

  scan:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: rotator-image-${{ github.run_id }}
      - name: Load image
        run: docker load -i "$IMAGE_TAR"
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: rotator:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

  push:
    needs: scan
    if: needs.scan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: rotator-image-${{ github.run_id }}
      - name: Load image
        run: docker load -i "$IMAGE_TAR"
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
      - name: Configure Artifact Registry auth
        run: |
          REGISTRY_HOST="${ARTIFACT_REGISTRY_IMAGE%%/*}"
          gcloud auth configure-docker "$REGISTRY_HOST" --quiet
        env:
          ARTIFACT_REGISTRY_IMAGE: ${{ secrets.ARTIFACT_REGISTRY_IMAGE }}
      - name: Push image
        run: |
          docker tag rotator:${{ github.sha }} "$ARTIFACT_REGISTRY_IMAGE:${{ github.sha }}"
          docker push "$ARTIFACT_REGISTRY_IMAGE:${{ github.sha }}"
        env:
          ARTIFACT_REGISTRY_IMAGE: ${{ secrets.ARTIFACT_REGISTRY_IMAGE }}
