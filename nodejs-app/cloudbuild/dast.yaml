substitutions:
  _TARGET_URL: ""
  _SCAN_MODE: "baseline"

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: validate-target
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        test -n "${_TARGET_URL}" || { echo "_TARGET_URL is required."; exit 1; }
        case "${_SCAN_MODE}" in
          baseline|active) ;;
          *) echo "_SCAN_MODE must be baseline or active."; exit 1 ;;
        esac

  - id: zap-scan
    name: ghcr.io/zaproxy/zaproxy:stable
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [ "${_SCAN_MODE}" = "active" ]; then
          zap-full-scan.py -t "${_TARGET_URL}" -J dast-report.json -r dast-report.html -w dast-report.md
        else
          zap-baseline.py -t "${_TARGET_URL}" -J dast-report.json -r dast-report.html -w dast-report.md
        fi

artifacts:
  objects:
    location: gs://${PROJECT_ID}-cloudbuild-artifacts/nodejs-app/dast/${BUILD_ID}/
    paths:
      - dast-report.json
      - dast-report.html
      - dast-report.md
